name: SimpleChat Docker Image Publish

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Azure Container Registry Login
      uses: Azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c # v2
      with:
        # Container registry username
        username: ${{ secrets.MAIN_ACR_USERNAME }}
        # Container registry password
        password: ${{ secrets.MAIN_ACR_PASSWORD }}
        # Container registry server url
        login-server: ${{ secrets.MAIN_ACR_LOGIN_SERVER }}
    - name: Normalize branch name for tag
      run: |
        REF="${GITHUB_REF_NAME}"
        SAFE=$(echo "$REF" \
          | tr '[:upper:]' '[:lower:]' \
          | sed 's#[^a-z0-9._-]#-#g' \
          | sed 's/^-*//;s/-*$//' \
          | cut -c1-128)
        echo "BRANCH_TAG=$SAFE" >> "$GITHUB_ENV"
        
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build and push the Docker image
      shell: bash
      env:
        ACR_LOGIN_SERVER: ${{ secrets.MAIN_ACR_LOGIN_SERVER }}
      run: |
        set -euo pipefail
        : "${ACR_LOGIN_SERVER:?MAIN_ACR_LOGIN_SERVER secret is missing or empty}"

        IMAGE="${ACR_LOGIN_SERVER}/simple-chat"
        TAG="$(date +'%Y-%m-%d')_${BRANCH_TAG}_${GITHUB_RUN_NUMBER}"

        BUILDER="simplechat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        docker buildx create --name "$BUILDER" --driver docker-container
        trap 'docker buildx rm "$BUILDER"' EXIT

        docker buildx build \
          --builder "$BUILDER" \
          --platform linux/amd64 \
          --provenance=false \
          --sbom=false \
          --file application/single_app/Dockerfile \
          --output "type=registry,oci-mediatypes=false" \
          --tag "${IMAGE}:${TAG}" \
          --tag "${IMAGE}:latest" \
          .
